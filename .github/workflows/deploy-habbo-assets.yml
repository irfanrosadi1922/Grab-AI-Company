name: Deploy HabboAssets Edge Function

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/habbo-assets/**"
      - ".github/workflows/deploy-habbo-assets.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.58.5

      - name: Deploy habbo-assets function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          supabase link --project-ref emtpwskousaodzcheaoy
          supabase functions deploy habbo-assets --project-ref emtpwskousaodzcheaoy
